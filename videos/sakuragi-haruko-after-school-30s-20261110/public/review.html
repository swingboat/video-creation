<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原速画面检查</title><style>body{margin:0;background:#151917;color:#f4eee4;font:16px system-ui;padding:24px}video{display:block;width:min(100%,1280px);margin:16px auto;background:#000}button{padding:12px 20px;font:inherit;margin-right:12px}header{max-width:1280px;margin:auto}p{color:#b3beb5}</style><header><h2 id="title">原速画面检查</h2><button id="play">从头按 1 倍速播放</button><button id="pause">暂停</button><p id="status">正在载入</p></header><video id="v" controls preload="auto" playsinline></video><script>const v=document.getElementById('v');const file=new URLSearchParams(location.search).get('clip')||'video/gather-native24-v1.mp4';v.src=file;document.getElementById('title').textContent=file;document.getElementById('play').onclick=()=>{v.currentTime=0;v.playbackRate=1;v.play()};document.getElementById('pause').onclick=()=>v.pause();function update(){document.getElementById('status').textContent=JSON.stringify({time:v.currentTime,duration:v.duration,rate:v.playbackRate,paused:v.paused,ended:v.ended,ready:v.readyState})}v.addEventListener('timeupdate',update);v.addEventListener('loadedmetadata',update);v.addEventListener('ended',update);</script></html>
