          - heading "Whisper" [level=1] [ref=e423]:
            - link [ref=e424] [cursor=pointer]:
              - /url: "#whisper"
              - img [ref=e426]
            - generic [ref=e428]: Whisper
          - paragraph [ref=e429]:
            - text: Whisper is a pre-trained model for automatic speech recognition (ASR) and speech translation. Trained on 680k hours of labelled data, Whisper models demonstrate a strong ability to generalise to many datasets and domains
            - strong [ref=e430]: without
            - text: the need for fine-tuning.
          - paragraph [ref=e431]:
            - text: Whisper was proposed in the paper
            - link "Robust Speech Recognition via Large-Scale Weak Supervision" [ref=e432] [cursor=pointer]:
              - /url: https://arxiv.org/abs/2212.04356
            - text: by Alec Radford et al from OpenAI. The original code repository can be found
            - link "here" [ref=e433] [cursor=pointer]:
              - /url: https://github.com/openai/whisper
            - text: .
          - paragraph [ref=e434]:
            - strong [ref=e435]: Disclaimer
            - text: ": Content for this model card has partly been written by the Hugging Face team, and parts of it were copied and pasted from the original model card."
          - heading "Model details" [level=2] [ref=e436]:
            - link [ref=e437] [cursor=pointer]:
              - /url: "#model-details"
              - img [ref=e439]
            - generic [ref=e441]: Model details
          - paragraph [ref=e442]:
            - text: Whisper is a Transformer based encoder-decoder model, also referred to as a
            - emphasis [ref=e443]: sequence-to-sequence
            - text: model. It was trained on 680k hours of labelled speech data annotated using large-scale weak supervision.
          - paragraph [ref=e444]:
            - text: The models were trained on either English-only data or multilingual data. The English-only models were trained on the task of speech recognition. The multilingual models were trained on both speech recognition and speech translation. For speech recognition, the model predicts transcriptions in the
            - emphasis [ref=e445]: same
            - text: language as the audio. For speech translation, the model predicts transcriptions to a
            - emphasis [ref=e446]: different
            - text: language to the audio.
          - paragraph [ref=e447]:
            - text: Whisper checkpoints come in five configurations of varying model sizes. The smallest four are trained on either English-only or multilingual data. The largest checkpoints are multilingual only. All ten of the pre-trained checkpoints are available on the
            - link "Hugging Face Hub" [ref=e448] [cursor=pointer]:
              - /url: https://huggingface.co/models?search=openai/whisper
            - text: ". The checkpoints are summarised in the following table with links to the models on the Hub:"
          - table [ref=e450]:
