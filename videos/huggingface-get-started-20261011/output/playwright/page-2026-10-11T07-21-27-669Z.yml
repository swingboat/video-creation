          - heading "Usage" [level=1] [ref=e498]:
            - link [ref=e499] [cursor=pointer]:
              - /url: "#usage"
              - img [ref=e501]
            - generic [ref=e503]: Usage
          - paragraph [ref=e504]:
            - text: To transcribe audio samples, the model has to be used alongside a
            - link "WhisperProcessor" [ref=e505] [cursor=pointer]:
              - /url: https://huggingface.co/docs/transformers/model_doc/whisper#transformers.WhisperProcessor
              - code [ref=e506]: WhisperProcessor
            - text: .
          - paragraph [ref=e507]:
            - text: The
            - code [ref=e508]: WhisperProcessor
            - text: "is used to:"
          - list [ref=e509]:
            - listitem [ref=e510]: Pre-process the audio inputs (converting them to log-Mel spectrograms for the model)
            - listitem [ref=e511]: Post-process the model outputs (converting them from tokens to text)
          - paragraph [ref=e512]: "The model is informed of which task to perform (transcription or translation) by passing the appropriate \"context tokens\". These context tokens are a sequence of tokens that are given to the decoder at the start of the decoding process, and take the following order:"
          - list [ref=e513]:
            - listitem [ref=e514]:
              - text: The transcription always starts with the
              - code [ref=e515]: <|startoftranscript|>
              - text: token
            - listitem [ref=e516]:
              - text: The second token is the language token (e.g.
              - code [ref=e517]: <|en|>
              - text: for English)
            - listitem [ref=e518]:
              - text: "The third token is the \"task token\". It can take one of two values:"
              - code [ref=e519]: <|transcribe|>
              - text: for speech recognition or
              - code [ref=e520]: <|translate|>
              - text: for speech translation
            - listitem [ref=e521]:
              - text: In addition, a
              - code [ref=e522]: <|notimestamps|>
              - text: token is added if the model should not include timestamp prediction
          - paragraph [ref=e523]: "Thus, a typical sequence of context tokens might look as follows:"
          - code [ref=e525]: <|startoftranscript|> <|en|> <|transcribe|> <|notimestamps|>
          - paragraph [ref=e526]: Which tells the model to decode in English, under the task of speech recognition, and not to predict timestamps.
          - paragraph [ref=e527]: These tokens can either be forced or un-forced. If they are forced, the model is made to predict each token at each position. This allows one to control the output language and task for the Whisper model. If they are un-forced, the Whisper model will automatically predict the output langauge and task itself.
          - paragraph [ref=e528]: "The context tokens can be set accordingly:"
          - code [ref=e530]: model.config.forced_decoder_ids = WhisperProcessor.get_decoder_prompt_ids(language="english", task="transcribe")
          - paragraph [ref=e531]: Which forces the model to predict in English under the task of speech recognition.
          - heading "Transcription" [level=2] [ref=e532]:
            - link [ref=e533] [cursor=pointer]:
              - /url: "#transcription"
              - img [ref=e535]
            - generic [ref=e537]: Transcription
          - heading "English to English" [level=3] [ref=e538]:
            - link [ref=e539] [cursor=pointer]:
              - /url: "#english-to-english"
              - img [ref=e541]
            - generic [ref=e543]: English to English
          - paragraph [ref=e544]: In this example, the context tokens are 'unforced', meaning the model automatically predicts the output language (English) and task (transcribe).
          - code [ref=e546]: ">>> from transformers import WhisperProcessor, WhisperForConditionalGeneration >>> from datasets import load_dataset >>> # load model and processor >>> processor = WhisperProcessor.from_pretrained(\"openai/whisper-small\") >>> model = WhisperForConditionalGeneration.from_pretrained(\"openai/whisper-small\") >>> model.config.forced_decoder_ids = None >>> # load dummy dataset and read audio files >>> ds = load_dataset(\"hf-internal-testing/librispeech_asr_dummy\", \"clean\", split=\"validation\") >>> sample = ds[0][\"audio\"] >>> input_features = processor(sample[\"array\"], sampling_rate=sample[\"sampling_rate\"], return_tensors=\"pt\").input_features >>> # generate token ids >>> predicted_ids = model.generate(input_features) >>> # decode token ids to text >>> transcription = processor.batch_decode(predicted_ids, skip_special_tokens=False) ['<|startoftranscript|><|en|><|transcribe|><|notimestamps|> Mr. Quilter is the apostle of the middle classes and we are glad to welcome his gospel.<|endoftext|>'] >>> transcription = processor.batch_decode(predicted_ids, skip_special_tokens=True) [' Mr. Quilter is the apostle of the middle classes and we are glad to welcome his gospel.']"
          - paragraph [ref=e547]:
            - text: The context tokens can be removed from the start of the transcription by setting
            - code [ref=e548]: skip_special_tokens=True
            - text: .
          - heading "French to French" [level=3] [ref=e549]:
            - link [ref=e550] [cursor=pointer]:
              - /url: "#french-to-french"
              - img [ref=e552]
            - generic [ref=e554]: French to French
          - paragraph [ref=e555]: The following example demonstrates French to French transcription by setting the decoder ids appropriately.
          - code [ref=e557]: ">>> from transformers import WhisperProcessor, WhisperForConditionalGeneration >>> from datasets import Audio, load_dataset >>> # load model and processor >>> processor = WhisperProcessor.from_pretrained(\"openai/whisper-small\") >>> model = WhisperForConditionalGeneration.from_pretrained(\"openai/whisper-small\") >>> forced_decoder_ids = processor.get_decoder_prompt_ids(language=\"french\", task=\"transcribe\") >>> # load streaming dataset and read first audio sample >>> ds = load_dataset(\"common_voice\", \"fr\", split=\"test\", streaming=True) >>> ds = ds.cast_column(\"audio\", Audio(sampling_rate=16_000)) >>> input_speech = next(iter(ds))[\"audio\"] >>> input_features = processor(input_speech[\"array\"], sampling_rate=input_speech[\"sampling_rate\"], return_tensors=\"pt\").input_features >>> # generate token ids >>> predicted_ids = model.generate(input_features, forced_decoder_ids=forced_decoder_ids) >>> # decode token ids to text >>> transcription = processor.batch_decode(predicted_ids) ['<|startoftranscript|><|fr|><|transcribe|><|notimestamps|> Un vrai travail intéressant va enfin être mené sur ce sujet.<|endoftext|>'] >>> transcription = processor.batch_decode(predicted_ids, skip_special_tokens=True) [' Un vrai travail intéressant va enfin être mené sur ce sujet.']"
          - heading "Translation" [level=2] [ref=e558]:
            - link [ref=e559] [cursor=pointer]:
              - /url: "#translation"
              - img [ref=e561]
            - generic [ref=e563]: Translation
          - paragraph [ref=e564]: Setting the task to "translate" forces the Whisper model to perform speech translation.
          - heading "French to English" [level=3] [ref=e565]:
            - link [ref=e566] [cursor=pointer]:
              - /url: "#french-to-english"
              - img [ref=e568]
            - generic [ref=e570]: French to English
          - code [ref=e572]: ">>> from transformers import WhisperProcessor, WhisperForConditionalGeneration >>> from datasets import Audio, load_dataset >>> # load model and processor >>> processor = WhisperProcessor.from_pretrained(\"openai/whisper-small\") >>> model = WhisperForConditionalGeneration.from_pretrained(\"openai/whisper-small\") >>> forced_decoder_ids = processor.get_decoder_prompt_ids(language=\"french\", task=\"translate\") >>> # load streaming dataset and read first audio sample >>> ds = load_dataset(\"common_voice\", \"fr\", split=\"test\", streaming=True) >>> ds = ds.cast_column(\"audio\", Audio(sampling_rate=16_000)) >>> input_speech = next(iter(ds))[\"audio\"] >>> input_features = processor(input_speech[\"array\"], sampling_rate=input_speech[\"sampling_rate\"], return_tensors=\"pt\").input_features >>> # generate token ids >>> predicted_ids = model.generate(input_features, forced_decoder_ids=forced_decoder_ids) >>> # decode token ids to text >>> transcription = processor.batch_decode(predicted_ids, skip_special_tokens=True) [' A very interesting work, we will finally be given on this subject.']"
          - heading "Evaluation" [level=2] [ref=e573]:
            - link [ref=e574] [cursor=pointer]:
              - /url: "#evaluation"
              - img [ref=e576]
            - generic [ref=e578]: Evaluation
          - paragraph [ref=e579]:
            - text: This code snippet shows how to evaluate Whisper Small on
            - link "LibriSpeech test-clean" [ref=e580] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/librispeech_asr
            - text: ":"
          - code [ref=e582]: ">>> from datasets import load_dataset >>> from transformers import WhisperForConditionalGeneration, WhisperProcessor >>> import torch >>> from evaluate import load >>> librispeech_test_clean = load_dataset(\"librispeech_asr\", \"clean\", split=\"test\") >>> processor = WhisperProcessor.from_pretrained(\"openai/whisper-small\") >>> model = WhisperForConditionalGeneration.from_pretrained(\"openai/whisper-small\").to(\"cuda\") >>> def map_to_pred(batch): >>> audio = batch[\"audio\"] >>> input_features = processor(audio[\"array\"], sampling_rate=audio[\"sampling_rate\"], return_tensors=\"pt\").input_features >>> batch[\"reference\"] = processor.tokenizer._normalize(batch['text']) >>> >>> with torch.no_grad(): >>> predicted_ids = model.generate(input_features.to(\"cuda\"))[0] >>> transcription = processor.decode(predicted_ids) >>> batch[\"prediction\"] = processor.tokenizer._normalize(transcription) >>> return batch >>> result = librispeech_test_clean.map(map_to_pred) >>> wer = load(\"wer\") >>> print(100 * wer.compute(references=result[\"reference\"], predictions=result[\"prediction\"])) 3.432213777886737"
          - heading "Long-Form Transcription" [level=2] [ref=e583]:
            - link [ref=e584] [cursor=pointer]:
              - /url: "#long-form-transcription"
              - img [ref=e586]
            - generic [ref=e588]: Long-Form Transcription
          - paragraph [ref=e589]:
            - text: The Whisper model is intrinsically designed to work on audio samples of up to 30s in duration. However, by using a chunking algorithm, it can be used to transcribe audio samples of up to arbitrary length. This is possible through Transformers
            - link "pipeline" [ref=e590] [cursor=pointer]:
              - /url: https://huggingface.co/docs/transformers/main_classes/pipelines#transformers.AutomaticSpeechRecognitionPipeline
              - code [ref=e591]: pipeline
            - text: method. Chunking is enabled by setting
            - code [ref=e592]: chunk_length_s=30
            - text: when instantiating the pipeline. With chunking enabled, the pipeline can be run with batched inference. It can also be extended to predict sequence level timestamps by passing
            - code [ref=e593]: return_timestamps=True
            - text: ":"
          - code [ref=e595]: ">>> import torch >>> from transformers import pipeline >>> from datasets import load_dataset >>> device = \"cuda:0\" if torch.cuda.is_available() else \"cpu\" >>> pipe = pipeline( >>> \"automatic-speech-recognition\", >>> model=\"openai/whisper-small\", >>> chunk_length_s=30, >>> device=device, >>> ) >>> ds = load_dataset(\"hf-internal-testing/librispeech_asr_dummy\", \"clean\", split=\"validation\") >>> sample = ds[0][\"audio\"] >>> prediction = pipe(sample.copy(), batch_size=8)[\"text\"] \" Mr. Quilter is the apostle of the middle classes, and we are glad to welcome his gospel.\" >>> # we can also return timestamps for the predictions >>> prediction = pipe(sample.copy(), batch_size=8, return_timestamps=True)[\"chunks\"] [{'text': ' Mr. Quilter is the apostle of the middle classes and we are glad to welcome his gospel.', 'timestamp': (0.0, 5.44)}]"
          - paragraph [ref=e596]:
            - text: Refer to the blog post
            - link "ASR Chunking" [ref=e597] [cursor=pointer]:
              - /url: https://huggingface.co/blog/asr-chunking
            - text: for more details on the chunking algorithm.
          - heading "Fine-Tuning" [level=2] [ref=e598]:
            - link [ref=e599] [cursor=pointer]:
              - /url: "#fine-tuning"
              - img [ref=e601]
            - generic [ref=e603]: Fine-Tuning
          - paragraph [ref=e604]:
            - text: The pre-trained Whisper model demonstrates a strong ability to generalise to different datasets and domains. However, its predictive capabilities can be improved further for certain languages and tasks through
            - emphasis [ref=e605]: fine-tuning
            - text: . The blog post
            - link "Fine-Tune Whisper with 🤗 Transformers" [ref=e606] [cursor=pointer]:
              - /url: https://huggingface.co/blog/fine-tune-whisper
            - text: provides a step-by-step guide to fine-tuning the Whisper model with as little as 5 hours of labelled data.
          - heading "Evaluated Use" [level=3] [ref=e607]:
            - link [ref=e608] [cursor=pointer]:
              - /url: "#evaluated-use"
              - img [ref=e610]
            - generic [ref=e612]: Evaluated Use
          - paragraph [ref=e613]: The primary intended users of these models are AI researchers studying robustness, generalization, capabilities, biases, and constraints of the current model. However, Whisper is also potentially quite useful as an ASR solution for developers, especially for English speech recognition. We recognize that once models are released, it is impossible to restrict access to only “intended” uses or to draw reasonable guidelines around what is or is not research.
          - paragraph [ref=e614]: The models are primarily trained and evaluated on ASR and speech translation to English tasks. They show strong ASR results in ~10 languages. They may exhibit additional capabilities, particularly if fine-tuned on certain tasks like voice activity detection, speaker classification, or speaker diarization but have not been robustly evaluated in these areas. We strongly recommend that users perform robust evaluations of the models in a particular context and domain before deploying them.
          - paragraph [ref=e615]: In particular, we caution against using Whisper models to transcribe recordings of individuals taken without their consent or purporting to use these models for any kind of subjective classification. We recommend against use in high-risk domains like decision-making contexts, where flaws in accuracy can lead to pronounced flaws in outcomes. The models are intended to transcribe and translate speech, use of the model for classification is not only not evaluated but also not appropriate, particularly to infer human attributes.
          - heading "Training Data" [level=2] [ref=e616]:
            - link [ref=e617] [cursor=pointer]:
              - /url: "#training-data"
              - img [ref=e619]
            - generic [ref=e621]: Training Data
          - paragraph [ref=e622]: The models are trained on 680,000 hours of audio and the corresponding transcripts collected from the internet. 65% of this data (or 438,000 hours) represents English-language audio and matched English transcripts, roughly 18% (or 126,000 hours) represents non-English audio and English transcripts, while the final 17% (or 117,000 hours) represents non-English audio and the corresponding transcript. This non-English data represents 98 different languages.
          - paragraph [ref=e623]:
            - text: As discussed in
            - link "the accompanying paper" [ref=e624] [cursor=pointer]:
              - /url: https://cdn.openai.com/papers/whisper.pdf
            - text: ", we see that performance on transcription in a given language is directly correlated with the amount of training data we employ in that language."
          - heading "Performance and Limitations" [level=2] [ref=e625]:
            - link [ref=e626] [cursor=pointer]:
              - /url: "#performance-and-limitations"
              - img [ref=e628]
            - generic [ref=e630]: Performance and Limitations
          - paragraph [ref=e631]: Our studies show that, over many existing ASR systems, the models exhibit improved robustness to accents, background noise, technical language, as well as zero shot translation from multiple languages into English; and that accuracy on speech recognition and translation is near the state-of-the-art level.
          - paragraph [ref=e632]: However, because the models are trained in a weakly supervised manner using large-scale noisy data, the predictions may include texts that are not actually spoken in the audio input (i.e. hallucination). We hypothesize that this happens because, given their general knowledge of language, the models combine trying to predict the next word in audio with trying to transcribe the audio itself.
          - paragraph [ref=e633]:
            - text: Our models perform unevenly across languages, and we observe lower accuracy on low-resource and/or low-discoverability languages or languages where we have less training data. The models also exhibit disparate performance on different accents and dialects of particular languages, which may include higher word error rate across speakers of different genders, races, ages, or other demographic criteria. Our full evaluation results are presented in
            - link "the paper accompanying this release" [ref=e634] [cursor=pointer]:
              - /url: https://cdn.openai.com/papers/whisper.pdf
            - text: .
          - paragraph [ref=e635]:
            - text: In addition, the sequence-to-sequence architecture of the model makes it prone to generating repetitive texts, which can be mitigated to some degree by beam search and temperature scheduling but not perfectly. Further analysis on these limitations are provided in
            - link "the paper" [ref=e636] [cursor=pointer]:
              - /url: https://cdn.openai.com/papers/whisper.pdf
            - text: . It is likely that this behavior and hallucinations may be worse on lower-resource and/or lower-discoverability languages.
          - heading "Broader Implications" [level=2] [ref=e637]:
            - link [ref=e638] [cursor=pointer]:
              - /url: "#broader-implications"
              - img [ref=e640]
            - generic [ref=e642]: Broader Implications
          - paragraph [ref=e643]: We anticipate that Whisper models’ transcription capabilities may be used for improving accessibility tools. While Whisper models cannot be used for real-time transcription out of the box – their speed and size suggest that others may be able to build applications on top of them that allow for near-real-time speech recognition and translation. The real value of beneficial applications built on top of Whisper models suggests that the disparate performance of these models may have real economic implications.
          - paragraph [ref=e644]: There are also potential dual use concerns that come with releasing Whisper. While we hope the technology will be used primarily for beneficial purposes, making ASR technology more accessible could enable more actors to build capable surveillance technologies or scale up existing surveillance efforts, as the speed and accuracy allow for affordable automatic transcription and translation of large volumes of audio communication. Moreover, these models may have some capabilities to recognize specific individuals out of the box, which in turn presents safety concerns related both to dual use and disparate performance. In practice, we expect that the cost of transcription is not the limiting factor of scaling up surveillance projects.
